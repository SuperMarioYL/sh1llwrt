<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: $SHELL to sh1llwrt prompt and cache to llama.cpp CPU Metal to shell integration insert and confirm">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="206" y1="180" x2="262" y2="180" marker-end="url(#ah-l)"/>
    <line x1="412" y1="180" x2="468" y2="180" marker-end="url(#ah-l)"/>
    <line x1="618" y1="180" x2="674" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching dashed data flow (dasharray period 16; 32 to 0 = 2 periods = seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="206" y1="180" x2="258" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="412" y1="180" x2="464" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="618" y1="180" x2="670" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots flowing along each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M206,180 L258,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M412,180 L464,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M618,180 L670,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: blue input / purple agent / green inference / blue output; breathing staggered -->
  <g>
    <rect x="56"  y="140" width="150" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="131" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">$SHELL</text>
    <text x="131" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#6E6E73">zsh · bash</text>

    <rect x="262" y="140" width="150" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="337" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">sh1llwrt</text>
    <text x="337" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#6E6E73">prompt · cache</text>

    <rect x="468" y="140" width="150" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="543" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">llama.cpp</text>
    <text x="543" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#6E6E73">CPU · Metal</text>

    <rect x="674" y="140" width="150" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="749" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">integration</text>
    <text x="749" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#6E6E73">insert · confirm</text>
  </g>

  <!-- flow caption -->
  <text x="440" y="280" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">AskRequest in → AskReply out, offline, no account</text>
</svg>
